<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="55%" stop-color="#0d111d"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>

    <!-- Outer Delta Glow Gradient -->
    <linearGradient id="deltaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Recurrent Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Core Orb Gradient -->
    <radialGradient id="orbGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle Neural Grid Accent -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <circle cx="256" cy="256" r="190" fill="none" stroke-dasharray="4 8"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="2 6"/>
  </g>

  <!-- Outer Glowing Geometric Delta Shield (Symbol of Delta Attention) -->
  <g filter="url(#neonGlow)">
    <path d="M 256,92 L 416,368 L 96,368 Z"
          fill="none"
          stroke="url(#deltaGrad)"
          stroke-width="14"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>

  <!-- Recurrent Dynamic Flow Wave (DGDA Loop) -->
  <path d="M 148,348 Q 256,230 364,348"
        fill="none"
        stroke="url(#ribbonGrad)"
        stroke-width="18"
        stroke-linecap="round"
        filter="url(#softShadow)"/>

  <!-- Secondary Dynamic Wave -->
  <path d="M 180,300 Q 256,200 332,300"
        fill="none"
        stroke="#38bdf8"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.9"/>

  <!-- Sparse Attention Focus Lines radiating to Vertices -->
  <g stroke="#93c5fd" stroke-width="2" opacity="0.45" stroke-dasharray="4 4">
    <line x1="256" y1="230" x2="256" y2="108"/>
    <line x1="256" y1="230" x2="400" y2="356"/>
    <line x1="256" y1="230" x2="112" y2="356"/>
  </g>

  <!-- Central Superposition Singularity Orb -->
  <circle cx="256" cy="230" r="26" fill="url(#orbGrad)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="230" r="10" fill="#ffffff"/>

  <!-- 3 Stream Nodes at Vertices (Local Window, Top-k Sparse, HCA Latent) -->
  <circle cx="256" cy="98" r="10" fill="#a855f7" filter="url(#neonGlow)"/>
  <circle cx="256" cy="98" r="4" fill="#ffffff"/>

  <circle cx="410" cy="362" r="10" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="410" cy="362" r="4" fill="#ffffff"/>

  <circle cx="102" cy="362" r="10" fill="#3b82f6" filter="url(#neonGlow)"/>
  <circle cx="102" cy="362" r="4" fill="#ffffff"/>

  <!-- Minimal Brand Label -->
  <text x="256" y="445"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="6"
        fill="#f8fafc"
        text-anchor="middle">MABA</text>
  <text x="256" y="475"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', Roboto, sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="3"
        fill="#94a3b8"
        text-anchor="middle">LINEAR RECURRENCE &amp; SPARSE ATTENTION</text>
</svg>
