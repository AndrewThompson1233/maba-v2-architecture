<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="640">
  <defs>
    <!-- Card & Canvas Gradients -->
    <radialGradient id="cardBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <linearGradient id="mabaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="qwenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cpmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="denseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="640" fill="#090d16"/>
  <rect width="1076" height="636" x="2" y="2" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">Architectural Comparison: Modern Long-Context Paradigms</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Empirical architecture &amp; memory scaling comparison: Maba vs Qwen3.8-Flash-Next vs MiniCPM-5 vs Dense Baseline</text>
  </g>

  <!-- 4 Model Architecture Cards -->
  <!-- Card 1: Maba (Highlight) -->
  <g transform="translate(40, 95)">
    <rect width="235" height="505" rx="12" fill="url(#cardBg)" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="68" height="22" rx="6" fill="#1d4ed8"/>
    <text x="50" y="31" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">MABA</text>
    <text x="16" y="60" font-family="sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Maba Core</text>
    <text x="16" y="76" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600">3:1 DGDA / MABA-SA</text>

    <!-- Architecture Layer Diagram -->
    <g transform="translate(16, 95)">
      <rect width="203" height="30" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="101" y="19" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#93c5fd" text-anchor="middle">MABA-SA (MLA Sparse d_c=128)</text>
      
      <rect y="36" width="203" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="101" y="62" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">3x DGDA Linear Recurrence</text>
      <text x="101" y="78" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">O(1) State | Fused Triton Kernel</text>
    </g>

    <!-- Metrics List -->
    <g transform="translate(16, 220)">
      <text y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">RECURRENCE SHARE</text>
      <text y="18" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">75.0% (15 of 20 layers)</text>

      <text y="50" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">KV CACHE @ 1M TOKENS</text>
      <text y="68" font-family="sans-serif" font-size="15" font-weight="800" fill="#4ade80">1.20 GB (39.6x saved)</text>

      <text y="100" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">DECODE COMPLEXITY</text>
      <text y="118" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">O(1) Flat (35 ms/tok)</text>

      <text y="150" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">NEEDLE RETRIEVAL</text>
      <text y="168" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">100% @ 1,000,000 tok</text>

      <text y="200" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">POSITION ENCODING</text>
      <text y="218" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">NoPE (Recurrent Decay)</text>

      <text y="248" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">EDGE / CONSUMER READY</text>
      <text y="266" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ade80">Yes (Fits in 6 GB VRAM)</text>
    </g>
  </g>

  <!-- Card 2: Qwen3.8-Flash-Next -->
  <g transform="translate(295, 95)">
    <rect width="235" height="505" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="96" height="22" rx="6" fill="#6b21a8"/>
    <text x="64" y="31" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">QWEN 2026</text>
    <text x="16" y="60" font-family="sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Qwen3.8-Flash-Next</text>
    <text x="16" y="76" font-family="sans-serif" font-size="11" fill="#c084fc" font-weight="600">GDN + QSA Micro-Block</text>

    <!-- Architecture Layer Diagram -->
    <g transform="translate(16, 95)">
      <rect width="203" height="30" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
      <text x="101" y="19" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#d8b4fe" text-anchor="middle">QSA Micro-Block Attention</text>
      
      <rect y="36" width="203" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="101" y="62" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c084fc" text-anchor="middle">GDN Gated DeltaNet</text>
      <text x="101" y="78" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">125B MoE (6B Active)</text>
    </g>

    <!-- Metrics List -->
    <g transform="translate(16, 220)">
      <text y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">RECURRENCE SHARE</text>
      <text y="18" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">~50.0% (GDN Hybrid)</text>

      <text y="50" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">KV CACHE @ 1M TOKENS</text>
      <text y="68" font-family="sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">~4.8 GB (MoE Compressed)</text>

      <text y="100" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">DECODE COMPLEXITY</text>
      <text y="118" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Sublinear O(log L)</text>

      <text y="150" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">NEEDLE RETRIEVAL</text>
      <text y="168" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Native 262k / 1M YaRN</text>

      <text y="200" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">POSITION ENCODING</text>
      <text y="218" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">YaRN RoPE Extrapolation</text>

      <text y="248" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">EDGE / CONSUMER READY</text>
      <text y="266" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Server Class (125B Weights)</text>
    </g>
  </g>

  <!-- Card 3: MiniCPM-5 -->
  <g transform="translate(550, 95)">
    <rect width="235" height="505" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="96" height="22" rx="6" fill="#9f1239"/>
    <text x="64" y="31" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">OPENBMB 2026</text>
    <text x="16" y="60" font-family="sans-serif" font-size="16" font-weight="800" fill="#f8fafc">MiniCPM-5</text>
    <text x="16" y="76" font-family="sans-serif" font-size="11" fill="#fb7185" font-weight="600">Dense On-Device (1B/2B)</text>

    <!-- Architecture Layer Diagram -->
    <g transform="translate(16, 95)">
      <rect width="203" height="96" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="101" y="45" font-family="sans-serif" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">100% Dense GQA</text>
      <text x="101" y="62" font-family="sans-serif" font-size="9" fill="#f43f5e" text-anchor="middle">Grouped-Query Attention</text>
      <text x="101" y="78" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Full KV Cache Allocation</text>
    </g>

    <!-- Metrics List -->
    <g transform="translate(16, 220)">
      <text y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">RECURRENCE SHARE</text>
      <text y="18" font-family="sans-serif" font-size="14" font-weight="700" fill="#f87171">0.0% (Pure Attention)</text>

      <text y="50" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">KV CACHE @ 1M TOKENS</text>
      <text y="68" font-family="sans-serif" font-size="15" font-weight="700" fill="#f87171">24.5 GB (Linear O(L))</text>

      <text y="100" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">DECODE COMPLEXITY</text>
      <text y="118" font-family="sans-serif" font-size="14" font-weight="700" fill="#f87171">Linear O(L) Slowdown</text>

      <text y="150" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">NEEDLE RETRIEVAL</text>
      <text y="168" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Max 131,072 Tokens</text>

      <text y="200" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">POSITION ENCODING</text>
      <text y="218" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">RoPE (Rotary Embeddings)</text>

      <text y="248" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">EDGE / CONSUMER READY</text>
      <text y="266" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Short Context Only (&lt;32k)</text>
    </g>
  </g>

  <!-- Card 4: Dense Transformer Baseline -->
  <g transform="translate(805, 95)">
    <rect width="235" height="505" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="96" height="22" rx="6" fill="#334155"/>
    <text x="64" y="31" font-family="sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">STANDARD</text>
    <text x="16" y="60" font-family="sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Dense Transformer</text>
    <text x="16" y="76" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">Standard Softmax Baseline</text>

    <!-- Architecture Layer Diagram -->
    <g transform="translate(16, 95)">
      <rect width="203" height="96" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="101" y="45" font-family="sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">100% Dense Attention</text>
      <text x="101" y="62" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Quadratic O(L^2) Prefill</text>
      <text x="101" y="78" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Linear KV Cache per Layer</text>
    </g>

    <!-- Metrics List -->
    <g transform="translate(16, 220)">
      <text y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">RECURRENCE SHARE</text>
      <text y="18" font-family="sans-serif" font-size="14" font-weight="700" fill="#f87171">0.0% (No Recurrence)</text>

      <text y="50" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">KV CACHE @ 1M TOKENS</text>
      <text y="68" font-family="sans-serif" font-size="15" font-weight="700" fill="#ef4444">48.82 GB (OOM Crash)</text>

      <text y="100" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">DECODE COMPLEXITY</text>
      <text y="118" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444">Linear O(L) Degradation</text>

      <text y="150" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">NEEDLE RETRIEVAL</text>
      <text y="168" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Fails past ~64k (OOM)</text>

      <text y="200" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">POSITION ENCODING</text>
      <text y="218" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">RoPE (Rotary Embeddings)</text>

      <text y="248" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">EDGE / CONSUMER READY</text>
      <text y="266" font-family="sans-serif" font-size="13" font-weight="700" fill="#ef4444">No (Server Hardware Only)</text>
    </g>
  </g>
</svg>
