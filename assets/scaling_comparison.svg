<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="640">
  <defs>
    <radialGradient id="panelBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="mabaLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="640" fill="#090d16"/>
  <rect width="1076" height="636" x="2" y="2" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">Empirical Scaling: Maba vs Modern Frontiers (1k to 1M Tokens)</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Decoupled Gated Delta Attention maintains strictly flat O(1) decode latency and 39.6x reduced KV-cache</text>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 34)">
    <circle cx="0" cy="0" r="5" fill="#06b6d4"/>
    <text x="10" y="4" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Maba (O(1) Recurrent)</text>

    <circle cx="160" cy="0" r="5" fill="#c084fc"/>
    <text x="170" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc">Qwen3.8-Flash-Next</text>

    <circle cx="0" cy="20" r="5" fill="#fb7185"/>
    <text x="10" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#fb7185">MiniCPM-5 (Dense GQA)</text>

    <circle cx="160" cy="20" r="5" fill="#94a3b8"/>
    <text x="170" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Dense Transformer</text>
  </g>

  <!-- Chart 1: Decode Latency per Token (Left Panel) -->
  <g transform="translate(40, 95)">
    <rect width="485" height="505" rx="12" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Per-Token Decode Latency (ms)</text>
    <text x="24" y="50" font-family="sans-serif" font-size="11" fill="#64748b">Single-token generation latency across context lengths (Lower is Better)</text>

    <!-- Plot Grid -->
    <g transform="translate(50, 80)">
      <!-- Y-Axis Labels -->
      <text x="-12" y="340" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">0 ms</text>
      <line x1="0" y1="335" x2="400" y2="335" stroke="#334155" stroke-width="1"/>

      <text x="-12" y="260" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">100 ms</text>
      <line x1="0" y1="255" x2="400" y2="255" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <text x="-12" y="180" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">200 ms</text>
      <line x1="0" y1="175" x2="400" y2="175" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <text x="-12" y="100" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">300 ms</text>
      <line x1="0" y1="95" x2="400" y2="95" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <text x="-12" y="20" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">400 ms</text>
      <line x1="0" y1="15" x2="400" y2="15" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- X-Axis Labels -->
      <line x1="0" y1="335" x2="400" y2="335" stroke="#475569" stroke-width="1.5"/>
      <text x="20" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">1k</text>
      <text x="110" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">16k</text>
      <text x="200" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">64k</text>
      <text x="290" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">256k</text>
      <text x="380" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">1,000k</text>

      <!-- Curves -->
      <!-- Dense Transformer: Starts low (16ms), rises rapidly, OOM past 64k -->
      <path d="M 20,322 C 60,310 110,240 160,120 L 190,25" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4"/>
      <text x="195" y="25" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#ef4444">Dense OOM</text>

      <!-- MiniCPM-5: Linear degradation up to 131k -->
      <path d="M 20,315 C 70,300 130,260 210,140 L 240,65" fill="none" stroke="#fb7185" stroke-width="2.5"/>
      <text x="245" y="65" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#fb7185">MiniCPM-5 (131k max)</text>

      <!-- Qwen3.8-Flash-Next: Sublinear rise -->
      <path d="M 20,310 C 100,305 200,290 380,270" fill="none" stroke="#c084fc" stroke-width="2.5"/>
      <text x="385" y="265" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#c084fc">~80 ms</text>

      <!-- Maba: Perfectly Flat O(1) at 35 ms -->
      <path d="M 20,307 L 380,307" fill="none" stroke="#06b6d4" stroke-width="3.5"/>
      <circle cx="20" cy="307" r="4.5" fill="#06b6d4"/>
      <circle cx="110" cy="307" r="4.5" fill="#06b6d4"/>
      <circle cx="200" cy="307" r="4.5" fill="#06b6d4"/>
      <circle cx="290" cy="307" r="4.5" fill="#06b6d4"/>
      <circle cx="380" cy="307" r="4.5" fill="#06b6d4"/>
      
      <!-- Flat Highlight Banner -->
      <rect x="250" y="280" width="135" height="22" rx="4" fill="#0369a1"/>
      <text x="317" y="295" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">MABA: 35 ms O(1)</text>
    </g>
  </g>

  <!-- Chart 2: KV Cache Memory Footprint (Right Panel) -->
  <g transform="translate(555, 95)">
    <rect width="485" height="505" rx="12" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="800" fill="#f8fafc">KV Cache Footprint (Gigabytes)</text>
    <text x="24" y="50" font-family="sans-serif" font-size="11" fill="#64748b">FP16 KV memory allocation from 1k to 1,000,000 tokens (Lower is Better)</text>

    <!-- Plot Grid -->
    <g transform="translate(50, 80)">
      <!-- Y-Axis Labels -->
      <text x="-12" y="340" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">0 GB</text>
      <line x1="0" y1="335" x2="400" y2="335" stroke="#334155" stroke-width="1"/>

      <text x="-12" y="260" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">12 GB</text>
      <line x1="0" y1="255" x2="400" y2="255" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <text x="-12" y="180" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">24 GB</text>
      <line x1="0" y1="175" x2="400" y2="175" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <text x="-12" y="100" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">36 GB</text>
      <line x1="0" y1="95" x2="400" y2="95" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <text x="-12" y="20" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">48 GB</text>
      <line x1="0" y1="15" x2="400" y2="15" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- X-Axis Labels -->
      <line x1="0" y1="335" x2="400" y2="335" stroke="#475569" stroke-width="1.5"/>
      <text x="20" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">1k</text>
      <text x="110" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">16k</text>
      <text x="200" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">64k</text>
      <text x="290" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">256k</text>
      <text x="380" y="355" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">1,000k</text>

      <!-- Curves -->
      <!-- Dense Transformer: Linear explosion to 48.8 GB -->
      <path d="M 20,334 L 110,325 L 200,290 L 290,200 L 380,12" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="380" cy="12" r="4" fill="#94a3b8"/>
      <text x="375" y="-2" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="end">Dense: 48.82 GB</text>

      <!-- MiniCPM-5: Dense GQA reaches 24.5 GB @ 1M -->
      <path d="M 20,334 L 110,328 L 200,310 L 290,265 L 380,172" fill="none" stroke="#fb7185" stroke-width="2.5"/>
      <circle cx="380" cy="172" r="4" fill="#fb7185"/>
      <text x="375" y="162" font-family="sans-serif" font-size="10" font-weight="700" fill="#fb7185" text-anchor="end">MiniCPM: 24.5 GB</text>

      <!-- Qwen3.8-Flash-Next: ~4.8 GB @ 1M -->
      <path d="M 20,334 L 110,332 L 200,325 L 290,315 L 380,303" fill="none" stroke="#c084fc" stroke-width="2.5"/>
      <circle cx="380" cy="303" r="4" fill="#c084fc"/>
      <text x="375" y="293" font-family="sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="end">Qwen Flash: 4.8 GB</text>

      <!-- Maba: 1.20 GB @ 1M tokens (Flat horizontal line near bottom) -->
      <path d="M 20,335 L 110,334 L 200,332 L 290,330 L 380,327" fill="none" stroke="#06b6d4" stroke-width="3.5"/>
      <circle cx="380" cy="327" r="5" fill="#06b6d4"/>

      <!-- Maba Callout Box -->
      <rect x="230" y="300" width="145" height="24" rx="4" fill="#15803d"/>
      <text x="302" y="316" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">MABA: 1.20 GB (39.6x)</text>
    </g>
  </g>
</svg>
