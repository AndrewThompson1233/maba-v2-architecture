[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maba-v2-architecture"
version = "2.0.0"
description = "Maba v2 Architecture: Linear Recurrence & Sparse Attention Hybrid Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MABA Open Architecture License (MOAL-1.0)" }
authors = [
    { name = "Andrew Thompson" }
]
keywords = [
    "deep-learning",
    "pytorch",
    "transformer",
    "causal-lm",
    "llm",
    "sparse-attention",
    "linear-attention",
    "linear-recurrence",
    "recurrent-memory",
    "dgda",
    "maba-sa",
    "mla",
    "multi-head-latent-attention",
    "long-context",
    "1m-context",
    "sub-quadratic",
    "state-space-model",
    "ssm",
    "triton",
    "on-device-ai",
    "efficient-llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maba_sparse*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
